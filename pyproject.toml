[project]
name = "ndoc2md"
version = "0.1.0"
description = "Converte documentos (docx, odt, html, rtf, epub, pdf, ...) para Markdown preservando a hierarquia de títulos."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
# Suporte a PDF (pandoc não lê PDF). Instale com: uv sync --extra pdf
#
# RESTRIÇÃO DE PLATAFORMA: fixado na série 0.0.x para manter compatibilidade com
# macOS em CPU Intel (macosx_*_x86_64), que só tem wheel de `pymupdf` nessa faixa.
# A partir da 1.27.2.1, o pymupdf4llm passa a exigir `pymupdf_layout` -> `onnxruntime`,
# que NÃO publica wheel para macOS Intel em nenhuma versão do macOS, fazendo
# `uv sync --extra pdf` falhar.
# Em Apple Silicon/Linux/Windows pode-se soltar o teto: pdf = ["pymupdf4llm"].
pdf = ["pymupdf4llm>=0.0.22,<0.1"]

[project.scripts]
ndoc2md = "ndoc2md.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ndoc2md"]

[dependency-groups]
dev = [
    "pytest>=8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
